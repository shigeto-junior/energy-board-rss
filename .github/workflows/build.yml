name: Build Energy Board RSS

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間ごと（UTC）。JSTで 00/06/12/18 時頃
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [ main ]
    paths:
      - "build_feed.py"
      - "feeds.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feeds
        run: python3 build_feed.py --config feeds.json
      - name: Add index page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>Energy Board RSS</title>'
            echo '<h1>METI審議会 RSSフィード</h1><ul>'
            for f in docs/*.xml; do
              n=$(basename "$f")
              echo "<li><a href=\"$n\">$n</a></li>"
            done
            echo '</ul>'
          } > docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
